name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  pruefen:
    strategy:
      fail-fast: false
      matrix:
        # **Alle drei Systeme, und das ist keine Gründlichkeit um ihrer
        # selbst willen.** Der Schlüsselbund heißt auf jedem anders und
        # wird über eine eigene Abhängigkeit angesprochen; ein Fehler
        # darin fällt nur auf dem System auf, das ihn hat. Die
        # clikd-CLI hat genau daran eine Veröffentlichung verloren, die
        # unter Windows nicht übersetzte.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Der Schlüsselbund unter Linux ist der Geheimnisdienst von
      # freedesktop; ohne seine Kopfdateien übersetzt keyring nicht.
      - name: Systembibliotheken (nur Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
